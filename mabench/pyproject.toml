[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mabench"
version = "0.1.0"
description = "Benchmark tooling for streaming map algebra: tiler, tile store, oracle"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "rasterio>=1.3"]

[project.optional-dependencies]
blob = ["fsspec>=2023.1"]          # plus s3fs / gcsfs / adlfs for the concrete store
plot = ["matplotlib>=3.7"]          # compare --heatmap, plots
dev = ["pytest>=7", "fsspec>=2023.1", "matplotlib>=3.7"]

[project.scripts]
mabench = "mabench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
